# Robolectric 全局配置（作用于 app 模块全部单测）
#
# sqliteMode=LEGACY
#   Robolectric 4.16 的原生 SQLite 默认开启（SQLiteModeConfigurer 默认 NATIVE），
#   每个碰数据库的 Robolectric 用例都会把 nativeruntime（libandroid_runtime）拉起来一次。
#   单测用 Room + Java 版 SQLite 足够（迁移测试走 MigrationTestHelper 读 schema，
#   不依赖原生实现），关掉能把这批装载从上百次降到只剩 @GraphicsMode(NATIVE) 的渲染用例。
#   已本地全量验证：1156 用例 0 失败 2 跳过，与改动前逐项一致。
#
#   注意：这条**不是** 2026-11-06 CI 那次「exit 134 / Class not found: java/nio/*Buffer」
#   的根因（根因是 ImageGridPickerDragTest 在 NATIVE 图形下长按，已单独修）；
#   留着是因为单测本来不需要原生 SQLite，少一条原生路径少一分环境差异。
#
# graphicsMode 不在这里钉：默认就是 LEGACY，需要真实像素的用例各自 @GraphicsMode(NATIVE)。
sqliteMode=LEGACY
