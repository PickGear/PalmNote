version: 2
updates:
  # Gradle 依赖（每周一检查）
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "PickGear"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # 新版本发布满 7 天才提 PR，避开"投毒版本存在的头几天"。
    # 仅作用于版本更新，安全更新（CVE 补丁）不受影响，仍会立即提 PR。
    cooldown:
      default-days: 7
    # 分组目的：一个分组 = 一个 PR。命中多个分组时取声明顺序中的第一个，
    # 因此"兜底分组"必须放在最后。
    groups:
      # 构建工具链：Gradle wrapper 与 Android Gradle Plugin 必须同步迁移
      # （AGP 9 要求 Gradle 9），且大版本升级只能人工执行，不可能靠合并
      # 机器人的 PR 完成。单独成组，避免与运行时依赖挤在同一个 PR 里 ——
      # 否则该 PR 既无法整体合并，也无法单独否决。
      build-toolchain:
        patterns:
          - "gradle-wrapper"
          - "com.android.application"
          - "com.android.library"
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      # 兜底：其余依赖（hilt、sqlcipher、opencv、mockk 等）合并为一个 PR，
      # 不再逐个单开
      other:
        patterns:
          - "*"

  # GitHub Actions 工作流（每周一检查）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "PickGear"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      # Actions 的更新全部合并为一个 PR
      actions:
        patterns:
          - "*"
