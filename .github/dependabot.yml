version: 2
updates:
  # Gradle 依赖（每周一检查）
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "PickGear"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # 新版本发布满 7 天才提 PR，避开"投毒版本存在的头几天"。
    # 仅作用于版本更新，安全更新（CVE 补丁）不受影响，仍会立即提 PR。
    cooldown:
      default-days: 7
    # 分组目的：一个分组 = 一个 PR。命中多个分组时取声明顺序中的第一个，
    # 因此"兜底分组"必须放在最后。
    groups:
      # 构建工具链：Gradle wrapper 与 Android Gradle Plugin 必须同步迁移
      # （AGP 9 要求 Gradle 9），且大版本升级只能人工执行，不可能靠合并
      # 机器人的 PR 完成。单独成组，避免与运行时依赖挤在同一个 PR 里 ——
      # 否则该 PR 既无法整体合并，也无法单独否决。
      # 注意：该组三个依赖目前全部在下方 ignore 名单中冻结，因此不会产生 PR；
      # 保留分组定义，是为了解冻之后 AGP 与 wrapper 仍作为一个整体升级。
      build-toolchain:
        patterns:
          - "gradle-wrapper"
          - "com.android.application"
          - "com.android.library"
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      # 兜底：其余依赖（hilt、sqlcipher、opencv、mockk 等）合并为一个 PR，
      # 不再逐个单开
      other:
        patterns:
          - "*"

    # ── 冻结名单：工具链升级前不提 PR ─────────────────────────────────
    # 下列依赖的新版本要求 compileSdk 37 / AGP 9.x，或与 Kotlin 编译器版本强耦合，
    # 在本项目当前工具链（compileSdk 36 + AGP 8.13.2 + Kotlin 2.2.20）下无法构建，
    # 合并过去只会得到永久红灯的 PR。升级策略与解禁条件见 docs/DEVELOPMENT.md §11.1。
    #
    # 下界取值依据：读取目标版本 AAR 内的 aar-metadata.properties
    # （minCompileSdk / minAndroidGradlePluginVersion）实测得出，非推测。
    # 注意 Gradle 生态的 versions 必须写 Maven 范围语法（[1.19.0,)），
    # 写成 ">= 1.19.0" 不会报错，但规则会静默失效。
    ignore:
      # 构建工具链：AGP / Gradle wrapper 的大版本迁移是独立项目（见 §11.1），
      # 由明确驱动触发，不接受 Dependabot 驱动；迁移时这三项一起升即可。
      # 冻结只拦 9.x，8.x 的补丁/次要版本仍会正常提 PR。
      - dependency-name: "com.android.application"
        versions: ["[9.0.0,)"]
      - dependency-name: "com.android.library"
        versions: ["[9.0.0,)"]
      - dependency-name: "gradle-wrapper"
        versions: ["[9.0.0,)"]
      - dependency-name: "androidx.core:core"
        versions: ["[1.19.0,)"] # 1.18.0 → minCompileSdk 36；1.19.0 → 37（minAgp 9.1.0）
      - dependency-name: "androidx.core:core-ktx"
        versions: ["[1.19.0,)"]
      - dependency-name: "androidx.hilt:hilt-navigation-compose"
        versions: ["[1.4.0,)"] # 1.3.0 → 35；1.4.0 → 37（minAgp 9.1.0）
      - dependency-name: "net.zetetic:sqlcipher-android"
        versions: ["[4.18.0,)"] # 4.17.0 无门槛；4.18.0 → 37
      # coil 自 3.5.0 起会把 androidx.compose.ui 抬到 1.11.x，而本项目依赖的
      # androidx.compose.material:material-icons-extended 已被 Google 冻结在 1.7.8，
      # 二者混用会让 Icons.Outlined.* 解析失败，表现为 Room KSP 报
      # "MissingType: AccountBook references a type that is not present"。
      # 实测：3.4.0 可用（compose-ui 解析到 1.9.4）；3.5.0 不可用。
      # coil 只有与 compose-bom 一起升才有意义，故一并冻结。
      # （另：3.6.0 起还叠加了 minCompileSdk=37 的门槛。）
      - dependency-name: "io.coil-kt.coil3:coil*"
        versions: ["[3.5.0,)"]
      # Hilt 插件自 2.59 起引用了 AGP 9 独有 API
      # （com.android.build.api.artifact.ScopedArtifact$POST_COMPILATION_CLASSES，
      # AGP 8.13.2 中不存在），在插件 apply 阶段即失败；且 Hilt 插件与
      # hilt-android 库的版本必须一致，不能只升其中一个，故整族冻结。
      # 实测边界：2.58 可用；2.59 / 2.59.1 / 2.59.2 / 2.60 / 2.60.1 均不可用。
      - dependency-name: "com.google.dagger*"
        versions: ["[2.59,)"]
      # OpenCV 4 → 5 跨大版本，C++/Java API 有重命名与移除，须人工迁移后再升
      - dependency-name: "org.opencv:opencv"
        versions: ["[5.0.0,)"]
      # Kotlin 生态整体冻结：这些库都由 Kotlin 编译，被冻结的 Kotlin 2.2.20 编译器
      # 去读更高版本编译出的元数据会直接报错；且 KSP 版本号内嵌 Kotlin 版本
      # （2.2.20-2.0.2），Dependabot 无法把它们配套升对。只放行 patch 修复。
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp*"
        versions: ["[2.3.0,)"] # KSP 版本号不是标准 semver，用 Maven 范围更可靠

  # GitHub Actions 工作流（每周一检查）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "PickGear"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      # Actions 的更新全部合并为一个 PR
      actions:
        patterns:
          - "*"
