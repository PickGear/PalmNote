name: 功能建议
description: 为 PalmNote 提出新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！描述清楚「场景」比描述「方案」更重要——先说说你想解决什么问题。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 你在什么情况下遇到什么困扰？例如："当 [...] 时，我总是很困扰。"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望发生什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他可行的做法或现有 App 的参考做法
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索既有 Issue，确认没有重复的建议
          required: true
        - label: 我了解 PalmNote 是纯本地应用，涉及联网/云同步的建议不会采纳
          required: true
